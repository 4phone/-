<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <!-- 보안 정책(CSP): 이 페이지의 스크립트 외에는 실행하지 않고, 구글 Apps Script(공유 저장소 연동) 외의 외부 접속·전송·글꼴·이미지 불러오기를 모두 막습니다 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-8FqM7qRVR68Y/AcW9luVGYPOuBlVdym9yj293EGyS3E='; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://script.google.com/macros/s/ https://script.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
    <meta name="referrer" content="no-referrer">
    <!-- 관리자 전용 페이지: 검색엔진에 노출되지 않도록 설정 -->
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>사거리인터넷 ADMIN</title>
    <link rel="icon" href="/사거리로고_투명.png" type="image/png">
    <style>
        :root {
            --olive-900: #1B1E0C; --olive-800: #2D3214; --olive-700: #3E441E; --olive-100: #E4E9D2;
            --gold: #FFD700; --gold-edge: #E3BE00; --orange: #E64A19; --ok: #2E7D32; --danger: #C0392B; --blue: #2F55B8;
            --paper: #EEF1E4; --panel: #FFFFFF; --line: #D5DBC3; --ink: #1E2310; --muted: #5F6A4F; --hint: #8A937A;
        }
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body { margin: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; background: var(--paper); color: var(--ink); font-size: 15px; line-height: 1.5; letter-spacing: -0.2px; }
        button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
        button { cursor: pointer; }
        :focus-visible { outline: 3px solid var(--olive-700); outline-offset: 2px; }
        .rail :focus-visible, .login :focus-visible { outline-color: var(--gold); }
        h1, h2, h3, p { margin: 0; }
        [hidden] { display: none !important; }

        /* ---------- 버튼 ---------- */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 8px; border: 1px solid #BFC7AA; background: #fff; font-weight: 600; font-size: 14px; line-height: 1.2; white-space: nowrap; }
        .btn:hover { background: #F4F6EA; }
        .btn-primary { background: var(--gold); border-color: var(--gold-edge); color: #1B1E0C; font-weight: 800; }
        .btn-primary:hover { background: #F6CB00; }
        .btn-dark { background: var(--olive-700); border-color: var(--olive-700); color: #fff; }
        .btn-dark:hover { background: var(--olive-800); }
        .btn-danger { color: var(--danger); border-color: #E3B5AE; }
        .btn-danger:hover { background: #FDF1EF; }
        .btn-sm { padding: 6px 10px; font-size: 13px; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }

        /* ---------- 로그인 ---------- */
        .login { min-height: 100vh; display: grid; place-items: center; background: var(--olive-800); padding: 20px; }
        .login-box { background: #fff; border-radius: 16px; padding: 34px 30px 28px; width: min(400px, 100%); box-shadow: 0 24px 60px rgba(0,0,0,.35); }
        .login-brand { font-weight: 800; font-size: 15px; color: var(--olive-700); }
        .login-box h1 { font-size: 26px; font-weight: 800; letter-spacing: -1px; margin: 6px 0 6px; }
        .login-box .sub { color: var(--muted); margin-bottom: 20px; font-size: 14px; }
        .login-box form { display: grid; gap: 12px; }
        .login-box .btn { width: 100%; padding: 13px; font-size: 16px; }
        .login-note { margin-top: 16px; font-size: 12.5px; color: var(--hint); line-height: 1.5; }
        .login-note.ok { color: #1F6B2A; font-weight: 700; }
        .drive-counts { margin: -2px 0 12px; font-size: 13px; color: var(--muted); }
        .login-note.warn { color: #9A3412; font-weight: 700; }
        .boot-msg { max-width: 520px; margin: 16vh auto 0; padding: 20px 22px; color: #2D3214; background: #fff; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; line-height: 1.6; }

        /* ---------- 전체 틀 ---------- */
        .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
        .rail { background: var(--olive-800); color: #fff; padding: 24px 14px 18px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 6px; }
        .brand { padding: 0 10px 18px; font-weight: 800; font-size: 19px; letter-spacing: -0.8px; line-height: 1.2; }
        .brand small { display: block; margin-top: 4px; color: var(--gold); font-weight: 700; font-size: 12.5px; letter-spacing: 0; }
        .nav { display: flex; flex-direction: column; gap: 3px; }
        .nav button { text-align: left; padding: 11px 12px; border-radius: 8px; border: none; background: none; color: #D5DBC0; font-weight: 600; font-size: 15px; }
        .nav button:hover { background: rgba(255,255,255,.07); }
        .nav button[aria-current="page"] { background: rgba(255,215,0,.15); color: var(--gold); font-weight: 800; }
        .rail-foot { margin-top: auto; display: grid; gap: 8px; padding: 14px 10px 0; border-top: 1px solid rgba(255,255,255,.14); }
        .rail-foot label { font-size: 12.5px; color: #B9C29F; font-weight: 600; }
        .rail-foot select { background: var(--olive-900); border: 1px solid rgba(255,255,255,.22); color: #fff; border-radius: 8px; padding: 8px 10px; width: 100%; }
        .rail-foot .btn { background: transparent; color: #E6EBD3; border-color: rgba(255,255,255,.28); }
        .rail-foot .btn:hover { background: rgba(255,255,255,.08); }
        .main { padding: 26px 34px 40px; max-width: 1200px; width: 100%; display: flex; flex-direction: column; }
        .sync-foot { margin-top: auto; padding-top: 48px; }
        .sync-foot-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 14px; font-size: 13px; color: var(--muted); }
        .sync-foot-inner b { color: var(--ok); }

        .mode-note { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; border-left: 5px solid var(--orange); background: #FFF6EE; padding: 11px 16px; border-radius: 0 8px 8px 0; margin-bottom: 22px; font-size: 14px; color: #5C3A1E; }
        .mode-note b { color: var(--orange); }

        .mode-note.ok { border-left-color: var(--ok); background: #F0F8F0; color: #1F4D2A; } .mode-note.ok b { color: var(--ok); }
        .mode-note.warn { border-left-color: #D69E2E; background: #FFFAEB; color: #744210; } .mode-note.warn b { color: #B7791F; }
        .mode-note.bad { border-left-color: var(--danger); background: #FDF1EF; color: #7B241C; } .mode-note.bad b { color: var(--danger); }
        .drive-line { font-size: 14.5px; font-weight: 700; padding: 10px 14px; border-radius: 8px; background: #F1F4E6; margin-bottom: 12px; color: var(--muted); }
        .drive-line.good { background: #E3F2E3; color: #1F6B2A; } .drive-line.bad { background: #FDECEA; color: #A33226; }
        .drive-tip { margin-top: 10px; font-size: 13px; color: var(--muted); }
        .code-box { width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; min-height: 96px; word-break: break-all; background: #F7F9F0; }
        .today-tasks { margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--line); }
        .tasks-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
        .tasks-bar h2 { font-size: 21px; font-weight: 800; letter-spacing: -0.7px; }
        .check-inline { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .staff-block { margin-bottom: 26px; }
        .staff-block .section-head .actions { gap: 14px; }
        .group-meta { font-size: 13.5px; color: var(--muted); font-weight: 600; }
        .adm-badge { display: inline-block; margin-left: 8px; font-size: 12px; font-weight: 800; background: var(--olive-700); color: #fff; border-radius: 4px; padding: 1px 7px; vertical-align: middle; letter-spacing: 0; }
        .row.done .title { color: var(--hint); text-decoration: line-through; }
        .date-filter { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
        .date-filter input[type="date"] { width: auto; padding: 7px 10px; }
        .date-chip { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: #FFF8DB; border: 1px solid #F0DC8A; border-radius: 8px; padding: 9px 14px; margin-bottom: 12px; font-size: 14px; font-weight: 700; color: #6B5300; }
        .field-wrap { display: grid; gap: 8px; }
        .quick-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .t-num { font-weight: 800; font-size: 15px; color: var(--olive-700); text-align: center; }
        .box-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
        .box-count { font-size: 13.5px; font-weight: 700; color: var(--muted); }
        .btn-report { background: var(--olive-700); border-color: var(--olive-700); color: #fff; font-weight: 800; }
        .btn-report:hover { background: var(--olive-800); }
        .btn.on-today { background: var(--ok); border-color: var(--ok); color: #fff; } .btn.on-today:hover { background: #276A2B; }
        .btn.on-yday { background: var(--blue); border-color: var(--blue); color: #fff; } .btn.on-yday:hover { background: #274A9C; }
        .date-chip.today { background: #E8F5E9; border-color: #A5D6A7; color: #1F5F26; }
        .date-chip.yday { background: #E8EEFB; border-color: #A9BCE8; color: #243F8F; }
        .report-img { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; display: block; }
        .me-fixed { color: #fff; font-weight: 800; font-size: 15px; padding: 2px 2px 0; overflow-wrap: anywhere; }
        .acct-email { font-size: 12px; color: #B9C29F; overflow-wrap: anywhere; margin-bottom: 4px; }
        .gate-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
        .gate-tabs .btn { flex: 1; padding: 10px; }
        .gate-tabs .btn.on { background: var(--olive-700); border-color: var(--olive-700); color: #fff; }
        .gate-acct { margin: 6px 0 18px; padding: 12px 14px; background: #F1F4E6; border-radius: 8px; font-weight: 800; overflow-wrap: anywhere; }
        .gate-actions { display: grid; gap: 8px; }
        .gate-actions .btn { width: 100%; padding: 13px; }
        .gate-links { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 18px; }
        .acct-group { margin-top: 18px; }
        .acct-group h3 { font-size: 15px; font-weight: 800; margin: 0 0 8px; color: var(--olive-800); }
        .acct-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
        .acct-row:last-child { border-bottom: none; }
        .acct-row b { overflow-wrap: anywhere; }
        .acct-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
        .acct-badge { display: inline-block; margin-left: 8px; font-size: 12px; font-weight: 800; border-radius: 4px; padding: 1px 7px; vertical-align: middle; }
        .acct-badge.ok { background: #DDF0DD; color: #1F6B2A; } .acct-badge.wait { background: #FFF3BF; color: #7A5B00; } .acct-badge.off { background: #E4E6DD; color: #5F6A4F; }
        .forms-sub { color: var(--muted); margin: 0 0 18px; }
        .forms-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
        .forms-col { display: grid; gap: 14px; min-width: 0; }
        /* 가입 장부 · 거래처별 개통 확인 */
        .reg-box { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 10px; min-width: 0; }
        .reg-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
        .reg-head h2 { font-size: 17px; font-weight: 800; letter-spacing: -0.5px; margin-right: auto; }
        .reg-head small { font-size: 12.5px; color: var(--muted); font-weight: 600; }
        .reg-months { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 8px; }
        .reg-months .btn { flex: none; }
        .reg-months .btn[aria-pressed="true"] { background: var(--olive-700); border-color: var(--olive-700); color: #fff; }
        .reg-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 9px 2px; border-top: 1px solid var(--line); }
        .reg-n { font-weight: 800; color: var(--olive-700); text-align: center; font-size: 14px; }
        .reg-main { min-width: 0; }
        .reg-main b { font-size: 14.5px; }
        .reg-kind { display: inline-block; font-size: 11.5px; font-weight: 800; border-radius: 4px; padding: 0 6px; margin-right: 6px; vertical-align: 1px; }
        .reg-kind.mobile { background: #E6EEFF; color: #2F55B8; } .reg-kind.wired { background: #E5F3E6; color: #1F6B2A; }
        .reg-sub { display: block; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
        .reg-act { display: flex; gap: 6px; }
        .reg-empty { padding: 18px 4px; color: var(--muted); font-size: 13.5px; border-top: 1px solid var(--line); }
        .dl-grp { border-top: 2px solid var(--olive-100); padding-top: 8px; margin-top: 6px; }
        .dl-grp:first-of-type { border-top: none; margin-top: 0; }
        .dl-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
        .dl-head h3 { font-size: 16px; font-weight: 800; margin-right: auto; }
        .dl-head h3 small { font-size: 12.5px; color: var(--muted); font-weight: 600; margin-left: 6px; }
        .dl-row { display: grid; grid-template-columns: 50px minmax(0, 1fr) auto 140px; gap: 6px 8px; align-items: center; padding: 8px 2px; border-top: 1px solid var(--line); }
        .dl-row.inst { background: #F6FAF3; }
        .dl-row.inst .dl-name { color: var(--muted); }
        .dl-date { font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
        .dl-name { background: none; border: none; padding: 0; font: inherit; font-weight: 700; font-size: 14.5px; text-align: left; color: var(--ink); cursor: pointer; overflow-wrap: anywhere; }
        .dl-name:hover { text-decoration: underline; }
        .dl-chk { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .dl-row input[type="date"] { padding: 5px 6px; font-size: 13px; }
        .dl-memo { grid-column: 2 / -1; padding: 6px 9px; font-size: 13px; }
        .dl-memo-row { grid-column: 2 / -1; display: flex; gap: 6px; align-items: center; min-width: 0; }
        .dl-memo-row .dl-memo { flex: 1 1 auto; min-width: 0; }
        .btn.gl-perm { border-color: #C9CDB8; color: #5B6150; }
        .btn.gl-perm.on { background: #E6F4EA; border-color: #2F855A; color: #1F6B2A; font-weight: 800; }
        .dl-memo-row .dl-dealer { flex: 0 0 auto; width: 118px; max-width: 34%; padding: 6px 8px; font-size: 13px; font-weight: 700; border: 1px solid #BFC7AA; border-radius: 8px; background: #FFFBEA; }
        .dl-name .reg-kind { font-size: 11px; }
        .btn-del { color: #B42318; border-color: #F1C0BA; background: #fff; }
        .btn-del:hover { background: #FFF1F0; }
        @media (max-width: 520px) { .dl-row { grid-template-columns: 44px minmax(0, 1fr) auto; } .dl-row input[type="date"] { grid-column: 2 / -1; } }
        .form-card { display: grid; gap: 6px; text-align: left; padding: 28px 24px; min-height: 130px; background: #fff; border: 2px solid var(--line); border-radius: 12px; cursor: pointer; font: inherit; color: var(--ink); }
        .form-card b { font-size: 21px; font-weight: 800; letter-spacing: -0.6px; } .form-card span { font-size: 14px; color: var(--muted); }
        .form-card:hover { border-color: var(--olive-700); background: #FBFCF4; }
        .teamjson { margin-top: 14px; padding: 14px 16px; background: #FFF8DB; border: 1px solid #F0DC8A; border-radius: 10px; }
        .teamjson h3 { font-size: 15px; font-weight: 800; margin: 0 0 6px; } .teamjson p { font-size: 13.5px; margin: 0 0 8px; } .teamjson .code-box { min-height: 56px; }
        .login-note.ver { font-size: 12px; color: var(--hint); margin-top: 10px; }
        .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
        .page-head h1 { font-size: 26px; font-weight: 800; letter-spacing: -1px; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

        .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
        .empty { padding: 26px 18px; color: var(--muted); text-align: center; font-size: 14.5px; }
        .section { margin-bottom: 28px; }
        .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
        .section-head h2 { font-size: 18px; font-weight: 800; letter-spacing: -0.6px; }
        .section-head > .btn, .section-head > button { flex-shrink: 0; white-space: nowrap; }
        @media (max-width: 480px) { .section-head { flex-wrap: wrap; } .section-head > div:first-child { flex: 1 1 100%; } }
        .link-btn { background: none; border: none; color: var(--olive-700); font-weight: 700; font-size: 13.5px; padding: 4px 2px; text-decoration: underline; text-underline-offset: 3px; }

        .who { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
        .who i { width: 10px; height: 10px; border-radius: 50%; background: var(--c, #9AA38A); flex: none; }

        /* ---------- 오늘 ---------- */
        .today-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 4px 0 18px; border-bottom: 3px solid var(--olive-700); margin-bottom: 24px; }
        .today-date { font-size: 46px; font-weight: 800; line-height: 1; letter-spacing: -2px; color: var(--olive-800); }
        .today-date small { font-size: 19px; font-weight: 600; letter-spacing: -0.4px; margin-left: 10px; color: var(--muted); }
        .today-sum { margin-top: 10px; color: var(--muted); font-size: 14.5px; }
        .board { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; align-items: start; }

        .row { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: none; border-right: none; border-top: none; }
        .row:last-child { border-bottom: none; }
        button.row:hover { background: #F7F9F0; }
        .row .time { font-weight: 800; font-size: 14.5px; color: var(--olive-700); }
        .row .time.all { color: var(--hint); font-weight: 600; font-size: 13px; }
        .row .title { font-weight: 700; overflow-wrap: anywhere; }
        .row .sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
        .row.task-row { grid-template-columns: minmax(0, 1fr) auto; }
        .due { font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }
        .due.late { color: var(--danger); }
        .due.today { color: var(--orange); }

        /* ---------- 캘린더 ---------- */
        .cal-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
        .cal-title { font-size: 22px; font-weight: 800; letter-spacing: -0.8px; min-width: 130px; }
        .cal-wrap { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
        .cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
        .cal-week div { text-align: center; padding: 9px 0; font-weight: 700; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); background: #F7F9F0; }
        .cal-week div:first-child { color: var(--danger); } .cal-week div:last-child { color: var(--blue); }
        .cal-cell { min-height: 106px; padding: 6px; background: #fff; border: none; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: left; display: flex; flex-direction: column; gap: 3px; overflow: hidden; align-items: stretch; }
        .cal-cell:nth-child(7n) { border-right: none; }
        .cal-cell:hover { background: #FAFBF4; }
        .cal-cell.out { background: #F6F7F0; }
        .cal-cell.out .cal-num { color: #A8B097; }
        .cal-cell.sel { box-shadow: inset 0 0 0 3px var(--olive-700); }
        .cal-num { font-weight: 700; font-size: 13px; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; flex: none; }
        .cal-cell.sun .cal-num { color: var(--danger); } .cal-cell.sat .cal-num { color: var(--blue); }
        .cal-cell.today .cal-num { background: var(--gold); color: #1B1E0C; }
        .chip.ev-done { text-decoration: line-through; opacity: .65; }
        .chip.ev-ext { opacity: .6; font-style: italic; }
        .ev-st { display: inline-block; font-size: 11.5px; font-weight: 800; padding: 1px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; }

                try { keepEl.focus({ preventScroll: true }); } catch (e) { keepEl.focus(); }
                if (keepSel && keepSel[0] != null) { try { keepEl.setSelectionRange(keepSel[0], keepSel[1]); } catch (e) { /* 체크 칸 등 */ } }
            }
            if (isMf && window.scrollY !== keepY) window.scrollTo(0, keepY);
            if (fk) {
                var again = document.querySelector('[data-fk="' + fk + '"]');
                if (again) { again.focus({ preventScroll: true }); if (fkSel && again.setSelectionRange) { try { again.setSelectionRange(fkSel[0], fkSel[1]); } catch (e) { /* 날짜 칸 등 */ } } }
            }
            [].forEach.call(document.querySelectorAll('.reg-months'), function (bar) {   // 고른 달이 보이게
                var on = bar.querySelector('[aria-pressed="true"]'); if (on && bar.scrollWidth > bar.clientWidth) bar.scrollLeft = Math.max(0, on.offsetLeft - bar.offsetLeft - 40);
            });
            var mta = memoEdit && document.querySelector('.t-memo-in');
            if (mta) {   // 메모 쓰는 중: 칸 높이 맞추고, 처음 열었거나 다시 그려져도 커서 위치 그대로
                memoGrow(mta);
                if (document.activeElement !== mta) { try { mta.focus({ preventScroll: true }); } catch (e) { mta.focus(); } }
                if (memoSel) { try { mta.setSelectionRange(memoSel[0], memoSel[1]); } catch (e) { /* 무시 */ } }
            } else if (memoEdit && !db.tasks.some(function (x) { return x.id === memoEdit.id; })) { memoEdit = null; memoSel = null; }   // 그 업무가 지워졌을 때만 정리 (다른 메뉴에 다녀와도 쓰던 메모는 그대로)
            try {   // 휴대폰: 위쪽 메뉴에서 지금 보고 있는 메뉴가 화면 밖으로 잘려 있으면 보이게 옆으로 맞춤
                var nv = document.querySelector('.rail .nav'), cur = nv && nv.querySelector('[aria-current="page"]');
                if (nv && cur && nv.scrollWidth > nv.clientWidth) { var l = cur.offsetLeft - nv.offsetLeft, r = l + cur.offsetWidth; if (l < nv.scrollLeft + 8 || r > nv.scrollLeft + nv.clientWidth - 8) nv.scrollLeft = Math.max(0, l - (nv.clientWidth - cur.offsetWidth) / 2); }
            } catch (e) { /* 무시 */ }
        }

        /* ---------- 시작 ---------- */
        readInvite();
        if (BUILD_TEAM_URL && DRIVE_URL_RE.test(BUILD_TEAM_URL)) { teamUrl = BUILD_TEAM_URL; teamCfgDone = true; teamCfgState = 'ok'; }
        else if (location.protocol === 'file:') { teamCfgDone = true; teamCfgState = 'file'; }   // 내 컴퓨터에서 직접 연 파일에서는 읽지 않음
        else loadTeamConfig();
        render();
        var bootMsg = document.getElementById('boot-msg'); if (bootMsg) bootMsg.remove();
    })();
    </script>
</body>
</html>
